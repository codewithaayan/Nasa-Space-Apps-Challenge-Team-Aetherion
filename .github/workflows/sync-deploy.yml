name: Sync upstream and deploy

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Redeploy even if the source is unchanged
        type: boolean
        default: true
  push:
    branches: [deployment]
    paths: ['.github/**', 'scripts/build-cloud.mjs', 'scripts/prepare-vercel.mjs', 'scripts/verify-deployment.mjs', 'deploy/vercel/**']

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'ridhofrd/Rozenweig-Index' && github.ref == 'refs/heads/deployment'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      deployments: read
    outputs:
      source_sha: ${{ steps.sync.outputs.source_sha }}
      release: ${{ steps.sync.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node --test .github/deployment/sync.test.mjs
      - name: Fast-forward fork and plan release
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_DEPLOY: ${{ github.event_name == 'push' || inputs.force == true }}
        run: node .github/deployment/sync.mjs

  validate:
    needs: sync
    if: needs.sync.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MOCK_DATA: 'false'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Check out deployment controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check out the exact app revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.sync.outputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install application dependencies
        working-directory: source
        run: |
          python -m pip install -r backend/requirements.txt
          npm ci
          npx playwright install --with-deps chromium
          echo "PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - name: Run offline backend tests
        working-directory: source/backend
        run: python -m pytest -q
      - name: Build and test the local application
        working-directory: source
        env:
          VITE_API_BASE_URL: /api
        run: npm run test:e2e
      - name: Build production frontend and package real backend data
        env:
          VITE_API_BASE_URL: https://trend-detective-aetherion-api.vercel.app/api
        run: |
          cp scripts/build-cloud.mjs source/scripts/build-cloud.mjs
          node source/scripts/build-cloud.mjs
          node scripts/prepare-vercel.mjs --source source --output work/deployment/vercel-api
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-frontend
          path: source/dist
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-api
          path: work/deployment/vercel-api
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [sync, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://trend-detective-aetherion.pages.dev
    permissions:
      contents: read
      deployments: write
    env:
      SOURCE_SHA: ${{ needs.sync.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-frontend
          path: work/deployment/frontend
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-api
          path: work/deployment/vercel-api
      - name: Install pinned hosting CLIs
        run: npm install --prefix "$RUNNER_TEMP/deploy-tools" --no-audit --no-fund vercel@65.16.0 wrangler@4.162.0
      - name: Check credentials and write public deployment settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node .github/deployment/configure.mjs
      - name: Record release start
        id: record
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/deployment/record.mjs start
      - name: Deploy Python API to Vercel Hobby
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          "$RUNNER_TEMP/deploy-tools/node_modules/.bin/vercel" deploy work/deployment/vercel-api --prod --yes --token "$VERCEL_TOKEN" --meta "sourceCommit=$SOURCE_SHA" --meta "githubCommitSha=$SOURCE_SHA"
      - name: Deploy frontend to Cloudflare Pages production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          "$RUNNER_TEMP/deploy-tools/node_modules/.bin/wrangler" pages deploy work/deployment/frontend --project-name "$CF_PROJECT" --branch "$CF_PRODUCTION_BRANCH" --commit-hash "$SOURCE_SHA" --commit-message "Upstream main $SOURCE_SHA" --commit-dirty=true
      - name: Verify the live application and CORS
        run: node scripts/verify-deployment.mjs --frontend "$FRONTEND_URL" --api "$API_URL"
      - name: Mark release successful
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.record.outputs.deployment_id }}
        run: node .github/deployment/record.mjs success
      - name: Record failed release
        if: failure() && steps.record.outputs.deployment_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.record.outputs.deployment_id }}
        run: node .github/deployment/record.mjs failure
